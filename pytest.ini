[pytest]
testpaths =
    astro_viewer/tests
python_files =
    test_*.py
norecursedirs =
    .git
    .idea
    .venv
    build
    dist
    logs
    astro_viewer/reports
addopts =
    --strict-markers
filterwarnings =
    error
    ignore:Setting the dtype on a NumPy array has been deprecated in NumPy 2\.5\..*:DeprecationWarning:skyfield\.searchlib
    ignore:Setting the shape on a NumPy array has been deprecated in NumPy 2\.5\..*:DeprecationWarning:skyfield\.keplerlib
markers =
    slow: long-running validation tests that are normally covered by the full suite
    report: developer-only report and renderer parity tests
    runtime: runtime behaviour and controller integration tests
