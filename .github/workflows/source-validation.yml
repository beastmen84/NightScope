# Purpose: Validate source commits on supported Windows and Linux Python baselines.
# Contract: Runs quality and dependency gates only; it never builds or publishes releases.

name: Source validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.14"
          - os: ubuntu-latest
            python-version: "3.12"
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            astro_viewer/requirements.txt
            requirements-dev.txt
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libdbus-1-3 libegl1 libgl1 libgtk-3-0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-shape0 libxcb-xkb1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r astro_viewer/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Run complete source gate
        run: python tools/run_checks.py --fast

  dependency-audit:
    name: Dependency audit / Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            astro_viewer/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r astro_viewer/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Audit installed dependency closure
        run: |
          python -m pip check
          python -m pip_audit --progress-spinner off
